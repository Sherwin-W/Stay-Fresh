; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
  
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library@^3.0.0
    bblanchon/ArduinoJson@^6.21.5

board_build.embed_txtfiles =
    certs/roots.pem

;mkdir -p certs
;curl --fail --show-error --location https://pki.goog/roots.pem -o certs/roots.pem
;curl --fail --show-error --location https://letsencrypt.org/certs/isrgrootx1.pem -o certs/isrgrootx1.pem
;cat certs/isrgrootx1.pem >> certs/roots.pem